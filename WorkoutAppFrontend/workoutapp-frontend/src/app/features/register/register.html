<div class="login-page">
  <div class="login-card">
    <h1 class="login-title">Registracija</h1>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="email">Email</label>
        <input id="email" type="email" formControlName="email" />
      </div>

      <div class="form-group">
        <label for="password">Lozinka</label>
        <input id="password" type="password" formControlName="password" />
      </div>

      <div class="form-group">
        <label for="confirmPassword">Potvrdi lozinku</label>
        <input id="confirmPassword" type="password" formControlName="confirmPassword" />
      </div>

      <p class="field-hint" *ngIf="form.errors?.['passwordMismatch'] && form.get('confirmPassword')?.touched">
        Lozinke se ne poklapaju.
      </p>

      <button type="submit" [disabled]="form.invalid">Registruj se</button>

      <p class="error-message" *ngIf="errorMessage">{{ errorMessage }}</p>
    </form>

    <p class="register-hint">Already have an account? <a routerLink="/login">Login</a></p>
  </div>
</div>
